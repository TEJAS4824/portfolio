<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64C8B4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="180" height="180" rx="40" fill="#0A0B14" stroke="#191A25" stroke-width="2"/>
  
  <!-- Outer glowing border -->
  <rect x="8" y="8" width="164" height="164" rx="36" fill="none" stroke="url(#logoGrad)" stroke-width="3" filter="url(#glow)" stroke-opacity="0.8"/>

  <!-- Literal bold 'TM' text for extremely clear legibility -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="url(#logoGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" letter-spacing="-2" filter="url(#glow)">TM</text>
</svg>