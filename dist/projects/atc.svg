<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#121620"/>
  
  <!-- Radial radar grid lines -->
  <circle cx="400" cy="225" r="80" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <circle cx="400" cy="225" r="160" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <circle cx="400" cy="225" r="240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <circle cx="400" cy="225" r="320" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  
  <!-- Radar Crosshairs -->
  <line x1="80" y1="225" x2="720" y2="225" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <line x1="400" y1="20" x2="400" y2="430" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <line x1="180" y1="45" x2="620" y2="405" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <line x1="180" y1="405" x2="620" y2="45" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />

  <!-- Gradient and neon glow setup -->
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64C8B4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Flight Path Vectors (Neon Curved Tracks) -->
  <path d="M 120 100 Q 300 120 420 200 T 700 320" stroke="url(#neonGrad)" stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="8,4" filter="url(#neonGlow)" />
  <path d="M 250 400 Q 380 280 480 180 T 620 50" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,6" />

  <!-- Aircraft Targets -->
  
  <!-- Target 1 -->
  <g transform="translate(420, 200)">
    <circle cx="0" cy="0" r="5" fill="#64C8B4" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#64C8B4" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Connector line to label -->
    <line x1="8" y1="-8" x2="40" y2="-40" stroke="#64C8B4" stroke-opacity="0.7" stroke-width="1" />
    <line x1="40" y1="-40" x2="130" y2="-40" stroke="#64C8B4" stroke-opacity="0.7" stroke-width="1" />
    <!-- Target label info -->
    <rect x="40" y="-72" width="90" height="28" rx="4" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="46" y="-60" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">AI204</text>
    <text x="46" y="-50" fill="#64C8B4" font-family="monospace" font-size="8">3200FT 250KTS</text>
  </g>

  <!-- Target 2 -->
  <g transform="translate(200, 105)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <circle cx="0" cy="0" r="9" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <!-- Connector line to label -->
    <line x1="6" y1="6" x2="25" y2="25" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
    <line x1="25" y1="25" x2="105" y2="25" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
    <!-- Target label info -->
    <rect x="25" y="29" width="80" height="28" rx="4" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="31" y="41" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">SG719</text>
    <text x="31" y="51" fill="#38bdf8" font-family="monospace" font-size="8">4100FT 280KTS</text>
  </g>

  <!-- Target 3 -->
  <g transform="translate(565, 125)">
    <circle cx="0" cy="0" r="5" fill="#f43f5e" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Alert Connector line -->
    <line x1="8" y1="-8" x2="35" y2="-35" stroke="#f43f5e" stroke-opacity="0.7" stroke-width="1" />
    <line x1="35" y1="-35" x2="120" y2="-35" stroke="#f43f5e" stroke-opacity="0.7" stroke-width="1" />
    <!-- Alert label info -->
    <rect x="35" y="-67" width="85" height="28" rx="4" fill="#1e293b" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1.5" />
    <text x="41" y="-55" fill="#f43f5e" font-family="monospace" font-size="9" font-weight="bold">TRAFFIC ALERT</text>
    <text x="41" y="-45" fill="#ffffff" font-family="monospace" font-size="8">GAP &lt; 1000FT</text>
  </g>

  <!-- Radar Scan line -->
  <line x1="400" y1="225" x2="682" y2="57" stroke="#64C8B4" stroke-width="1.5" stroke-opacity="0.5" filter="url(#neonGlow)"/>
  
  <!-- Sweeper gradient wedge simulating radar screen sweep -->
  <path d="M400 225 L682 57 A320 320 0 0 0 560 20 Z" fill="url(#neonGrad)" fill-opacity="0.05" />

  <!-- ATC Control Panel HUD (Top Left) -->
  <rect x="30" y="30" width="220" height="85" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="55" fill="#64C8B4" font-family="monospace" font-size="11" font-weight="bold">SIM_STATUS: ONLINE</text>
  <text x="45" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Unity XR Core</text>
  <text x="45" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">AR/VR ATC Simulator</text>
  
  <!-- Compass HUD (Bottom Right) -->
  <rect x="620" y="340" width="150" height="80" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
  <text x="635" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BEARING</text>
  <text x="635" y="390" fill="#ffffff" font-family="monospace" font-size="20" font-weight="bold">324.5° N</text>
</svg>
