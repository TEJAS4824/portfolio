<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#121620"/>
  
  <!-- Subtle futuristic grid background -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Glowing gradients & filters -->
  <defs>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64C8B4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Futuristic Dashboard Background Glow -->
  <circle cx="400" cy="225" r="250" fill="#64C8B4" fill-opacity="0.05" filter="url(#neonGlow)" />
  <circle cx="400" cy="225" r="150" fill="#38bdf8" fill-opacity="0.03" filter="url(#neonGlow)" />

  <!-- Main Dashboard Window -->
  <rect x="80" y="50" width="640" height="340" rx="12" fill="url(#windowGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="80" y="50" width="640" height="40" fill="#1e293b" />
  <!-- Rounded corners for top -->
  <path d="M 80 62 a 12 12 0 0 1 12 -12 h 616 a 12 12 0 0 1 12 12 v 28 h -640 v -28 z" fill="#1e293b" />
  <path d="M 80 90 L 720 90" stroke="#334155" stroke-width="2" />
  <circle cx="110" cy="70" r="5" fill="#ef4444" />
  <circle cx="130" cy="70" r="5" fill="#eab308" />
  <circle cx="150" cy="70" r="5" fill="#22c55e" />
  <text x="310" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">CORPORATE DIAGNOSTICS</text>

  <!-- Sidebar layout -->
  <rect x="100" y="110" width="140" height="260" rx="8" fill="#0f172a" fill-opacity="0.5" stroke="#1e293b" stroke-width="2"/>
  <rect x="115" y="130" width="40" height="40" rx="8" fill="#334155" />
  <rect x="165" y="135" width="60" height="10" rx="4" fill="#334155" />
  <rect x="165" y="152" width="40" height="8" rx="4" fill="#1e293b" />
  
  <rect x="115" y="190" width="110" height="12" rx="4" fill="#64C8B4" fill-opacity="0.2" stroke="#64C8B4" stroke-width="1" />
  <rect x="115" y="215" width="90" height="12" rx="4" fill="#1e293b" />
  <rect x="115" y="240" width="100" height="12" rx="4" fill="#1e293b" />
  <rect x="115" y="265" width="80" height="12" rx="4" fill="#1e293b" />
  
  <rect x="115" y="335" width="8" height="8" rx="4" fill="#10b981" filter="url(#neonGlow)"/>
  <text x="135" y="343" fill="#64C8B4" font-family="monospace" font-size="11" font-weight="bold">SYSTEM ACTIVE</text>

  <!-- Main Content Area: Radar Chart Area representing multi-domain assessments -->
  <g transform="translate(360, 230)">
    <!-- Base grid circles -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#334155" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#334155" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="#334155" stroke-dasharray="4 4" />
    <!-- Axes -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#334155" />
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#334155" />
    <line x1="-60" y1="-60" x2="60" y2="60" stroke="#334155" />
    <line x1="-60" y1="60" x2="60" y2="-60" stroke="#334155" />
    
    <!-- Radar Data Polygon -->
    <polygon points="0,-75 55,-40 75,0 45,55 -25,70 -65,25 -50,-45" fill="#64C8B4" fill-opacity="0.15" stroke="#64C8B4" stroke-width="2" filter="url(#neonGlow)" />
    
    <!-- Radar Data Points -->
    <circle cx="0" cy="-75" r="4" fill="#38bdf8" />
    <circle cx="55" cy="-40" r="4" fill="#38bdf8" />
    <circle cx="75" cy="0" r="4" fill="#38bdf8" />
    <circle cx="45" cy="55" r="4" fill="#38bdf8" />
    <circle cx="-25" cy="70" r="4" fill="#38bdf8" />
    <circle cx="-65" cy="25" r="4" fill="#38bdf8" />
    <circle cx="-50" cy="-45" r="4" fill="#38bdf8" />
    
    <!-- Domain Labels -->
    <text x="-5" y="-95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">CULTURE</text>
    <text x="85" y="-5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">TECH</text>
    <text x="-5" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">PROCESS</text>
    <text x="-120" y="-5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">STRATEGY</text>
  </g>

  <!-- Analytics Bar Chart (Right Side) -->
  <g transform="translate(500, 110)">
    <text x="0" y="15" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">READINESS INDEX</text>
    <line x1="0" y1="25" x2="190" y2="25" stroke="#334155" stroke-dasharray="2 2" />
    
    <rect x="0" y="60" width="28" height="60" rx="4" fill="url(#barGrad)" />
    <rect x="40" y="30" width="28" height="90" rx="4" fill="url(#barGrad)" />
    <rect x="80" y="80" width="28" height="40" rx="4" fill="url(#barGrad)" />
    <rect x="120" y="40" width="28" height="80" rx="4" fill="url(#barGrad)" />
    <rect x="160" y="65" width="28" height="55" rx="4" fill="url(#barGrad)" />
    
    <line x1="-10" y1="120" x2="190" y2="120" stroke="#334155" stroke-width="2" />
  </g>
  
  <!-- Info Summary Cards -->
  <rect x="500" y="260" width="90" height="65" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="2" />
  <text x="515" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">OVERALL</text>
  <text x="515" y="308" fill="#64C8B4" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" filter="url(#neonGlow)">86%</text>

  <rect x="600" y="260" width="90" height="65" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="2" />
  <text x="615" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REPORTS</text>
  <text x="615" y="308" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">3.4k</text>

  <rect x="500" y="335" width="190" height="35" rx="8" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="540" y="357" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">GENERATE REPORT</text>
  <path d="M 520 353 L 530 353 M 527 350 L 530 353 L 527 356" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
