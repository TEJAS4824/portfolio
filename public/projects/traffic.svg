<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#121620"/>
  
  <!-- Subtle futuristic grid background -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Glowing gradients & filters -->
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64C8B4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Intersecting roads -->
  <rect x="0" y="160" width="800" height="130" fill="url(#roadGrad)" />
  <rect x="330" y="0" width="140" height="450" fill="url(#roadGrad)" />
  
  <!-- Dashed lane markers -->
  <line x1="0" y1="225" x2="800" y2="225" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="15,15" stroke-width="2"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="15,15" stroke-width="2"/>

  <!-- AI detection vectors / scanner line -->
  <path d="M 280 0 L 280 450" stroke="#64C8B4" stroke-opacity="0.3" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Vehicles and AI Bounding Boxes -->
  <!-- Car 1 -->
  <rect x="180" y="180" width="80" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="175" y="175" width="90" height="50" rx="8" fill="none" stroke="#64C8B4" stroke-width="2" filter="url(#neonGlow)" />
  <text x="182" y="170" fill="#64C8B4" font-family="monospace" font-size="10" font-weight="bold">CAR: 98%</text>
  <circle cx="250" cy="190" r="3" fill="#38bdf8" />
  <circle cx="250" cy="210" r="3" fill="#38bdf8" />
  
  <!-- Car 2 -->
  <rect x="490" y="240" width="90" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="485" y="235" width="100" height="52" rx="8" fill="none" stroke="#64C8B4" stroke-width="2" filter="url(#neonGlow)" />
  <text x="490" y="230" fill="#64C8B4" font-family="monospace" font-size="10" font-weight="bold">TRUCK: 94%</text>
  
  <!-- Car 3 (entering intersection) -->
  <rect x="360" y="320" width="40" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Traffic Signal Status HUD -->
  <rect x="580" y="30" width="190" height="110" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
  <text x="600" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">TRAFFIC STATUS</text>
  <text x="600" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">OPTIMIZED</text>
  <circle cx="730" cy="80" r="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2" />
  <circle cx="730" cy="80" r="6" fill="#10b981" filter="url(#neonGlow)"/>

  <!-- AI System HUD Bottom Left -->
  <rect x="30" y="340" width="220" height="80" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
  <text x="50" y="370" fill="#64C8B4" font-family="monospace" font-size="12" font-weight="bold">&gt; Object Detection</text>
  <text x="50" y="395" fill="#f8fafc" font-family="monospace" font-size="14">SSD MobileNet V2</text>
  <circle cx="215" cy="380" r="5" fill="#64C8B4" filter="url(#neonGlow)"/>
</svg>
